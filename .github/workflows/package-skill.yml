name: Package Skills for CC Switch

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 📦 打包所有 Skills
        run: |
          cd skill
          for dir in */; do
            name="${dir%/}"
            zip -r "../${name}.skill.zip" "$dir"
            echo "✅ 打包: ${name}.skill.zip"
          done

      - name: ⬆️ 上传 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-skills
          path: '*.skill.zip'
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 📦 打包总包 ZIP（直接含 skill 文件夹，CC Switch 直接认）
        run: |
          cd skill
          zip -r ../obsidian-knowledge-base-bundle.zip ./
          echo "✅ 总包结构："
          unzip -l ../obsidian-knowledge-base-bundle.zip | head -20

      - name: 🏷️ 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            obsidian-knowledge-base-bundle.zip
          generate_release_notes: true
