name: Package Skill for CC Switch

on:
  push:
    branches: [main]
    paths:
      - 'skill/**'
      - '.github/workflows/package-skill.yml'
  workflow_dispatch:  # 支持手动触发

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 📦 打包 Skill
        run: |
          # skill/obsidian-knowledge-base/  →  obsidian-knowledge-base.skill.zip
          cd skill
          zip -r ../obsidian-knowledge-base.skill.zip obsidian-knowledge-base/
          echo "✅ 打包完成"
          unzip -l ../obsidian-knowledge-base.skill.zip

      - name: ⬆️ 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-knowledge-base.skill
          path: obsidian-knowledge-base.skill.zip
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 📦 打包 Skill（Release）
        run: |
          cd skill
          zip -r ../obsidian-knowledge-base.skill.zip obsidian-knowledge-base/

      - name: 🏷️ 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: obsidian-knowledge-base.skill.zip
          generate_release_notes: true
