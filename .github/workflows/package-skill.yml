name: Package Skills for CC Switch

on:
  push:
    branches: [main]
    paths:
      - 'skill/**'
      - '.github/workflows/package-skill.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 📦 打包所有 Skills
        run: |
          cd skill
          for dir in */; do
            name="${dir%/}"
            zip -r "../${name}.skill.zip" "$dir"
            echo "✅ 打包: ${name}.skill.zip"
          done
          echo "---"
          echo "共打包 $(ls -1 ../*.skill.zip 2>/dev/null | wc -l) 个 Skill"

      - name: ⬆️ 上传所有 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-skills
          path: '*.skill.zip'
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 📦 打包所有 Skills（Release）
        run: |
          cd skill
          for dir in */; do
            name="${dir%/}"
            zip -r "../${name}.skill.zip" "$dir"
          done
          # 也打包一个总包（所有 skill 合并在一个 ZIP）
          cd ..
          zip -r obsidian-knowledge-base-bundle.zip ingest.skill.zip lint.skill.zip obsidian-knowledge-base.skill.zip query.skill.zip web-pull.skill.zip

      - name: 🏷️ 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.skill.zip
            obsidian-knowledge-base-bundle.zip
          generate_release_notes: true
